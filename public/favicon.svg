<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!--
    GNB 로고와 같은 도형이다 — bg-primary(#171717, oklch(0.205 0 0)를
    캔버스로 실측한 sRGB)의 rounded-md(24px 기준 6px, radius-md 토큰) 사각형
    안에 lucide Command 아이콘(size 14, strokeWidth 2.4)을
    text-primary-foreground(#fafafa)로 얹는다. 예전 favicon.svg는 이
    사이트의 다른 로고 어디에도 없는, Supabase 로고 도형을 색만 바꿔
    그대로 쓴 파일이었다 — 사이트 정체성과 무관했을 뿐 아니라 상표
    문제도 있어 전부 교체했다.

    Command 아이콘은 24x24 좌표계 path를 14/24 비율로 축소해 중앙에
    놓는다((24-14)/2=5 오프셋 + scale(14/24)). transform으로 스케일하면
    stroke-width도 함께 줄어, GNB에서 size=14로 그릴 때와 같은 두께
    (2.4 * 14/24 ≈ 1.4px)가 그대로 나온다 — lucide-react가 size prop을
    줄 때 하는 것과 같은 방식이다.
  -->
  <rect width="24" height="24" rx="6" fill="#171717" />
  <g transform="translate(5,5) scale(0.5833)">
    <path
      d="M15 6v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3V6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3"
      fill="none"
      stroke="#fafafa"
      stroke-width="2.4"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
